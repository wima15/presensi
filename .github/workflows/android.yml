name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # diperlukan untuk membuat GitHub Release saat push tag v*

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Runner ubuntu-latest sudah membawa Android SDK; cukup terima lisensi & pastikan platform 36 ada.
      - name: Siapkan Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Pasang dependency & siapkan web
        run: |
          npm ci
          npm run sync

      - name: Build APK debug (bisa langsung dipasang)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # Build rilis hanya jika secret keystore sudah diisi (lihat README)
      - name: Cek secret signing
        id: sign
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "ada=$([ -n "$KS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build APK rilis (signed)
        if: steps.sign.outputs.ada == 'true'
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --no-daemon

      - name: Rapikan nama file
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/presensi-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/presensi-release.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: presensi-apk
          path: out/*.apk

      - name: Buat GitHub Release (saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
